name: Price Watch
version: "1.6.0"
slug: price_watch
description: Monitor Lidl Parkside prices and availability
url: https://github.com/rkobrle-alt/price-watch/tree/main/homeassistant/price_watch
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: stable
homeassistant_api: true
stdin: true
map:
  - type: share
    read_only: false
options:
  catalog_enabled: true
  catalog_batch_size: 25
  catalog_discovery_interval_cycles: 288
  product_urls: []
  notify_entity: notify.gmail_parkside_kobrle_fomei_com
  interval_seconds: 300
  timeout_seconds: 10
  price_drop_percentage: "20.00"
  notification_title: Parkside Price Watch
  daily_digest_enabled: true
  daily_digest_time: "08:00"
  individual_notifications_enabled: false
  immediate_operational_notifications_enabled: false
  weekly_operational_summary_enabled: true
  weekly_operational_summary_time: "08:00"
  favorite_product_urls: []
  hidden_product_urls: []
  target_prices: []
  included_categories: []
  watch_category_rules:
    - name: zahrada
      keywords: ["sekačka", "křovinořez", "řetězová pila", "na větve", "zavlažovací", "plotostřih"]
    - name: akumulatory_nabijecky
      keywords: ["akumulátor", "akumulátory", "nabíječka", "nabíječky"]
    - name: prislusenstvi
      keywords: ["sada bitů", "vrtáky", "vrtáků", "kotouč", "kotouče", "brusný papír", "příslušenství"]
    - name: pracovni_odevy
      keywords: ["pracovní kalhoty", "pracovní ponožky", "mikina", "pracovní rukavice", "pracovní bermudy", "pracovní kratasy"]
schema:
  favorite_product_urls:
    - url
  hidden_product_urls:
    - url
  target_prices:
    - url: url
      amount: str
      currency: "list(CZK|EUR)?"
  included_categories:
    - str
  watch_category_rules:
    - name: str
      keywords:
        - str
  catalog_enabled: bool?
  catalog_batch_size: int(1,)?
  catalog_discovery_interval_cycles: int(1,)?
  product_urls:
    - url
  notify_entity: str
  interval_seconds: int(1,)
  timeout_seconds: int(1,)
  price_drop_percentage: str?
  price_drop_amount: str?
  notification_title: str
  daily_digest_enabled: bool?
  daily_digest_time: str?
  individual_notifications_enabled: bool?
  immediate_operational_notifications_enabled: bool?
  weekly_operational_summary_enabled: bool?
  weekly_operational_summary_time: str?
  retention_preview_days: int(1,)?
  migration_import_file: str?
  migration_import_sha256: str?
  migration_import_confirmation: str?
image: ghcr.io/rkobrle-alt/price-watch
