name: Price Watch
version: "0.19.0"
slug: price_watch
description: Monitor Lidl Parkside prices and availability
url: https://github.com/rkobrle-alt/price-watch/tree/main/homeassistant/price_watch
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
stage: experimental
homeassistant_api: true
options:
  catalog_enabled: true
  catalog_batch_size: 25
  catalog_discovery_interval_cycles: 288
  product_urls: []
  notify_entity: notify.gmail_parkside_kobrle_fomei_com
  interval_seconds: 300
  timeout_seconds: 10
  price_drop_percentage: "20.00"
  notification_title: Parkside Price Watch
  daily_digest_enabled: true
  daily_digest_time: "08:00"
schema:
  catalog_enabled: bool?
  catalog_batch_size: int(1,)?
  catalog_discovery_interval_cycles: int(1,)?
  product_urls:
    - url
  notify_entity: str
  interval_seconds: int(1,)
  timeout_seconds: int(1,)
  price_drop_percentage: str?
  price_drop_amount: str?
  notification_title: str
  daily_digest_enabled: bool?
  daily_digest_time: str?
image: ghcr.io/rkobrle-alt/price-watch
