[project]
name = "price-watch"
version = "0.19.1"
requires-python = ">=3.13"
dependencies = ["tzdata==2026.3"]

[project.scripts]
price-watch = "applications.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=core --cov=infrastructure --cov=applications --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
